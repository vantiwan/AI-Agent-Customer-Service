<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能客服演示 Demo - Workcase</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f7f6; color: #333; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        .container { max-width: 600px; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #1a73e8; }
        p { line-height: 1.6; color: #666; }
        .hint { margin-top: 20px; font-weight: bold; color: #34a853; }
    </style>
</head>
<body>
    <div class="container">
        <h1>欢迎体验我的 AI 智能客服系统 🚀</h1>
        <p>这是一个基于 <b>扣子 (Coze)</b> 搭建的通用企业/SaaS 场景智能客服 Agent。它集成了行业知识库与特定的对话工作流，旨在实现自动化、顾问式的 B端 用户转化与答疑。</p>
        <p class="hint">👉 请点击页面右下角的聊天悬浮球，即可开始实时对话体验！</p>
    </div>

    <!-- 引入扣子官方 Chat SDK -->
    <script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.19/libs/cn/index.js"></script>
    <script>
        new CozeWebSDK.WebChatClient({
            config: {
                bot_id: '7382091355268661302', //
            },
            componentProps: {
                title: 'AI 智能助理',
            },
            auth: {
              type: 'token',
              token: 'pat_********',
              onRefreshToken: function () {
                return 'pat_********'
              }
            }
          });
    </script>
</body>
</html>
